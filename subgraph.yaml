specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
# Addresses + startBlock are injected at deploy time from networks.json via
# `graph build/deploy --network mainnet` (see `pnpm prepare-local` / `pnpm deploy-local`).
# Keep the placeholders below at 0x0 / 0 in git.
dataSources:
  - kind: ethereum
    name: MarketFactory
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MarketFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
        - name: Market
          file: ./abis/Market.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,address,address,uint8,address)
          handler: handleMarketCreated
      file: ./src/market-factory.ts

  - kind: ethereum
    name: PositionManager
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PositionManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Position
        - ProtocolStats
      abis:
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        - event: PositionCreated(indexed uint256,indexed address,address,uint256,uint8,uint256)
          handler: handlePositionCreated
        - event: PositionClosed(indexed uint256,indexed address)
          handler: handlePositionClosed
        - event: PositionLiquidated(indexed uint256,indexed address,uint256)
          handler: handlePositionLiquidated
      file: ./src/position-manager.ts

  - kind: ethereum
    name: LendingEngine
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LendingEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BorrowEvent
        - RepayEvent
        - DebtWriteOffEvent
        - Position
        - ProtocolStats
      abis:
        - name: LendingEngine
          file: ./abis/LendingEngine.json
      eventHandlers:
        - event: Borrowed(indexed uint256,indexed address,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed uint256,indexed address,uint256,uint256)
          handler: handleRepaid
        - event: DebtWrittenOff(indexed uint256,indexed uint256,uint256,address)
          handler: handleDebtWrittenOff
      file: ./src/lending-engine.ts

  - kind: ethereum
    name: LiquidationEngine
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LiquidationEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LiquidationEvent
        - Position
        - ProtocolStats
      abis:
        - name: LiquidationEngine
          file: ./abis/LiquidationEngine.json
      eventHandlers:
        - event: LiquidationExecuted(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleLiquidationExecuted
      file: ./src/liquidation-engine.ts

# Market proxies are created at runtime by MarketFactory; this template is instantiated
# (with the marketId in its context) from handleMarketCreated to index each market's Supply/Withdraw.
templates:
  - kind: ethereum
    name: Market
    network: mainnet
    source:
      abi: Market
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Market
        - SupplyPosition
      abis:
        - name: Market
          file: ./abis/Market.json
      eventHandlers:
        - event: Supply(indexed address,uint256,uint256)
          handler: handleSupply
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
      file: ./src/market.ts
