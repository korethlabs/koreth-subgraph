specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProtocolCore
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ProtocolCore
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
      abis:
        - name: ProtocolCore
          file: ./abis/ProtocolCore.json
        - name: LendingPool
          file: ./abis/LendingPool.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: LendingPoolRegistered(indexed address,indexed address)
          handler: handleLendingPoolRegistered
        - event: RiskManagerUpdated(indexed address,indexed address)
          handler: handleRiskManagerUpdated
      file: ./src/protocol-core.ts
  - kind: ethereum
    name: RiskManager
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: RiskManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CollateralType
        - ProtocolStats
      abis:
        - name: RiskManager
          file: ./abis/RiskManager.json
      eventHandlers:
        - event: CollateralConfigSet(indexed uint8)
          handler: handleCollateralConfigSet
        - event: LPTypeBorrowCapUpdated(indexed uint8,uint256)
          handler: handleLPTypeBorrowCapUpdated
        - event: BorrowRecorded(uint256,indexed uint8,uint256)
          handler: handleBorrowRecorded
        - event: AccrualRecorded(uint256,indexed uint8,uint256)
          handler: handleAccrualRecorded
        - event: RepayRecorded(uint256,indexed uint8,uint256)
          handler: handleRepayRecorded
      file: ./src/risk-manager.ts
  - kind: ethereum
    name: PositionManager
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PositionManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Position
        - CollateralType
        - Pool
        - ProtocolStats
      abis:
        - name: PositionManager
          file: ./abis/PositionManager.json
      eventHandlers:
        - event: PositionCreated(indexed uint256,indexed address,indexed
            address,address,uint256,uint8,uint256)
          handler: handlePositionCreated
        - event: PositionClosed(indexed uint256,indexed address)
          handler: handlePositionClosed
        - event: PositionLiquidated(indexed uint256,indexed address,uint256)
          handler: handlePositionLiquidated
      file: ./src/position-manager.ts
  - kind: ethereum
    name: LendingEngine
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LendingEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BorrowEvent
        - RepayEvent
        - DebtWriteOffEvent
        - Position
        - Pool
        - ProtocolStats
      abis:
        - name: LendingEngine
          file: ./abis/LendingEngine.json
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: Borrowed(indexed uint256,indexed address,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed uint256,indexed address,uint256,uint256)
          handler: handleRepaid
        - event: DebtWrittenOff(indexed uint256,indexed address,uint256,address)
          handler: handleDebtWrittenOff
      file: ./src/lending-engine.ts
  - kind: ethereum
    name: LiquidationEngine
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LiquidationEngine
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LiquidationEvent
        - Position
        - Pool
        - ProtocolStats
      abis:
        - name: LiquidationEngine
          file: ./abis/LiquidationEngine.json
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: LiquidationExecuted(indexed uint256,indexed
            address,uint256,uint256,uint256)
          handler: handleLiquidationExecuted
      file: ./src/liquidation-engine.ts
templates:
  - kind: ethereum
    name: LendingPool
    network: mainnet
    source:
      abi: LendingPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - SupplyPosition
      abis:
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: Supply(indexed address,uint256,uint256)
          handler: handleSupply
        - event: Withdraw(indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: InterestAccrued(uint256,uint256,uint256,uint256)
          handler: handleInterestAccrued
        - event: DeficitEliminated(uint256,uint256,uint256)
          handler: handleDeficitEliminated
      file: ./src/lending-pool.ts
