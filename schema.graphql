# Shared-pool model: one LendingPool per borrow asset, with risk parameters held per
# collateral type in RiskManager. A Position therefore points at BOTH a Pool (where its
# debt lives) and a CollateralType (which risk params govern it).

type Position @entity {
  id: ID!
  owner: Bytes!
  lpToken: Bytes!
  tokenId: BigInt
  amount: BigInt
  lpType: String!
  # The AMM pair/pool the LP token belongs to. Named `lpPool` to keep it distinct from
  # `pool`, which is the Koreth lending pool this position borrows from.
  lpPool: Bytes!
  token0: Bytes!
  token1: Bytes!
  pool: Pool!
  collateralType: CollateralType!
  depositValue: BigDecimal!
  currentDebt: BigDecimal!
  status: String!
  depositTimestamp: BigInt!
  updatedAt: BigInt!
  borrows: [BorrowEvent!]! @derivedFrom(field: "position")
  repays: [RepayEvent!]! @derivedFrom(field: "position")
  liquidations: [LiquidationEvent!]! @derivedFrom(field: "position")
  writeOffs: [DebtWriteOffEvent!]! @derivedFrom(field: "position")
}

# Keyed by borrow-asset address (not the proxy address): PositionCreated and DebtWrittenOff
# both identify a pool by its borrow asset, so this is the only id both can resolve without
# an extra contract call.
type Pool @entity {
  id: ID!
  address: Bytes!
  borrowAsset: Bytes!
  symbol: String!
  decimals: Int!
  totalSupply: BigDecimal!
  totalBorrow: BigDecimal!
  utilization: BigDecimal!
  supplyRate: BigDecimal!
  borrowRate: BigDecimal!
  positions: [Position!]! @derivedFrom(field: "pool")
  supplyPositions: [SupplyPosition!]! @derivedFrom(field: "pool")
  createdAt: BigInt!
  updatedAt: BigInt!
}

# Risk parameters are keyed by LP type alone and apply across every pool, so this entity is
# the shared-pool equivalent of the per-market config that used to live on Market.
type CollateralType @entity {
  id: ID! # lpType name, e.g. "UniswapV3"
  lpType: Int!
  maxLtv: BigInt!
  liquidationThreshold: BigInt!
  liquidationBonus: BigInt!
  haircut: BigInt!
  borrowCap: BigInt!
  enabled: Boolean!
  # Running USD (18-dec) exposure for this collateral type, accumulated from the
  # Borrow/Accrual/RepayRecorded events rather than read back from the contract.
  currentBorrows: BigDecimal!
  positions: [Position!]! @derivedFrom(field: "collateralType")
  updatedAt: BigInt!
}

type SupplyPosition @entity {
  id: ID! # poolId-user
  pool: Pool!
  user: Bytes!
  shares: BigInt!
  suppliedAmount: BigDecimal! # cumulative net supplied, human units
  updatedAt: BigInt!
}

type BorrowEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  borrower: Bytes!
  amount: BigDecimal!
  totalDebt: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type RepayEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  repayer: Bytes!
  amount: BigDecimal!
  remainingDebt: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type LiquidationEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  liquidator: Bytes!
  repayAmount: BigDecimal!
  collateralSeized: BigDecimal!
  liquidatorProfit: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type DebtWriteOffEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  pool: Pool!
  amount: BigDecimal!
  caller: Bytes!
  timestamp: BigInt!
  txHash: Bytes!
}

type ProtocolStats @entity {
  id: ID!
  totalTVL: BigDecimal!
  totalBorrowed: BigDecimal!
  totalPositions: BigInt!
  totalLiquidations: BigInt!
  totalFeesCollected: BigDecimal!
  # Protocol-wide USD borrows as reported by RiskManager, which is the figure the global
  # borrow cap is actually checked against.
  globalBorrowsUsd: BigDecimal!
}
