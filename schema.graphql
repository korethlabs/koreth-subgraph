# Shared-pool model: one LendingPool per borrow asset, with risk parameters held per
# collateral type in RiskManager. A Position therefore points at BOTH a Pool (where its
# debt lives) and a CollateralType (which risk params govern it).

type Position @entity {
  id: ID!
  owner: Bytes!
  lpToken: Bytes!
  tokenId: BigInt
  amount: BigInt
  lpType: String!
  # The AMM pair/pool the LP token belongs to. Named `lpPool` to keep it distinct from
  # `pool`, which is the Koreth lending pool this position borrows from.
  lpPool: Bytes!
  token0: Bytes!
  token1: Bytes!
  pool: Pool!
  collateralType: CollateralType!
  depositValue: BigDecimal!
  currentDebt: BigDecimal!
  status: String!
  depositTimestamp: BigInt!
  updatedAt: BigInt!
  borrows: [BorrowEvent!]! @derivedFrom(field: "position")
  repays: [RepayEvent!]! @derivedFrom(field: "position")
  liquidations: [LiquidationEvent!]! @derivedFrom(field: "position")
  writeOffs: [DebtWriteOffEvent!]! @derivedFrom(field: "position")
}

# Keyed by borrow-asset address (not the proxy address): PositionCreated and DebtWrittenOff
# both identify a pool by its borrow asset, so this is the only id both can resolve without
# an extra contract call.
type Pool @entity {
  id: ID!
  address: Bytes!
  borrowAsset: Bytes!
  symbol: String!
  decimals: Int!
  # Read from LendingPool.getPoolState() on every event that touches the pool, never
  # accumulated — interest accrual moves totalSupply without emitting a Supply/Withdraw, so an
  # accumulator would drift permanently.
  totalSupply: BigDecimal! # human units of borrowAsset
  totalBorrow: BigDecimal! # human units of borrowAsset
  utilization: BigDecimal! # fraction, 0.8 = 80%
  supplyRate: BigDecimal! # per-second rate as a fraction
  borrowRate: BigDecimal! # per-second rate as a fraction
  positions: [Position!]! @derivedFrom(field: "pool")
  supplyPositions: [SupplyPosition!]! @derivedFrom(field: "pool")
  createdAt: BigInt!
  updatedAt: BigInt!
}

# An AMM pool the protocol accepts as collateral backing. ProtocolCore stores this as a plain
# mapping, which no contract call can enumerate, so listing the accepted set is the one thing an
# index can do that the chain cannot — and the only reason this entity exists. Pool metadata
# (which DEX version it belongs to, which tokens it holds) the chain answers better, and is
# deliberately not stored here.
#
# whitelisted is the acceptance state as of the last indexed block, not as of now: it moves only
# when a whitelist event is indexed, so between the chain accepting or dropping a pool and this
# subgraph catching up, it is wrong. A consumer about to act on it — offering a pool for deposit,
# say — should confirm with ProtocolCore.isLpPoolSupported, which is settled at the same block the
# deposit will be.
#
# Removed pools are kept with whitelisted: false rather than deleted: a pool can be
# re-whitelisted, and a consumer that wants only the live ones filters on the flag.
type CollateralPool @entity {
  id: ID! # pool address, lowercased hex
  address: Bytes!
  whitelisted: Boolean!
  whitelistedAt: BigInt!
  removedAt: BigInt
}

# Risk parameters are keyed by LP type alone and apply across every pool, so this entity is
# the shared-pool equivalent of the per-market config that used to live on Market.
type CollateralType @entity {
  id: ID! # lpType name, e.g. "UniswapV3"
  lpType: Int!
  maxLtv: BigInt!
  liquidationThreshold: BigInt!
  liquidationBonus: BigInt!
  haircut: BigInt!
  borrowCap: BigInt!
  enabled: Boolean!
  # Running USD (18-dec) exposure for this collateral type, accumulated from the
  # Borrow/Accrual/RepayRecorded events rather than read back from the contract.
  currentBorrows: BigDecimal!
  positions: [Position!]! @derivedFrom(field: "collateralType")
  updatedAt: BigInt!
}

type SupplyPosition @entity {
  id: ID! # poolId-user
  pool: Pool!
  user: Bytes!
  # Both read from the pool's own share accounting rather than accumulated, so suppliedAmount
  # includes accrued interest: shares * pool.totalSupply / totalShares.
  shares: BigInt!
  suppliedAmount: BigDecimal! # redeemable value in human units of borrowAsset
  updatedAt: BigInt!
}

type BorrowEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  borrower: Bytes!
  amount: BigDecimal!
  totalDebt: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type RepayEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  repayer: Bytes!
  amount: BigDecimal!
  remainingDebt: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type LiquidationEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  liquidator: Bytes!
  repayAmount: BigDecimal!
  collateralSeized: BigDecimal!
  timestamp: BigInt!
  txHash: Bytes!
}

type DebtWriteOffEvent @entity(immutable: true) {
  id: ID!
  position: Position!
  pool: Pool!
  amount: BigDecimal!
  caller: Bytes!
  timestamp: BigInt!
  txHash: Bytes!
}

type ProtocolStats @entity {
  id: ID!
  totalTVL: BigDecimal! # USD
  totalPositions: BigInt!
  totalLiquidations: BigInt!
  totalFeesCollected: BigDecimal!
  # Protocol-wide USD borrows as reported by RiskManager, which is the figure the global
  # borrow cap is actually checked against. This replaces the old `totalBorrowed`, which summed
  # human units across borrow assets — adding USDC to WETH — and so was meaningless as soon as
  # a second pool existed. For a per-asset figure use Pool.totalBorrow.
  globalBorrowsUsd: BigDecimal!
}
