name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: codegen + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # graph-cli's dependency tree pins conflicting @types/node versions that make
      # `npm ci` reject the lockfile, so we use `npm install` here.
      - run: npm install --no-audit --no-fund

      # Generates AssemblyScript types from schema + committed ABIs, then compiles
      # the mappings to WASM. Catches schema/handler/ABI mismatches.
      - name: Codegen + build
        run: npm run build
