name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: codegen + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates AssemblyScript types from schema + committed ABIs, then compiles
      # the mappings to WASM. Catches schema/handler/ABI mismatches.
      - name: Codegen + build
        run: npm run build
