name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: codegen + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # graph-cli's dependency tree pins conflicting @types/node versions that make
      # `npm ci` reject the lockfile, so we use `npm install` here.
      - run: npm install --no-audit --no-fund

      # Generates AssemblyScript types from schema + committed ABIs, then compiles
      # the mappings to WASM. Catches schema/handler/ABI mismatches.
      #
      # Note what it cannot catch: it reads the ABIs committed here, so it only ever asks whether
      # the manifest agrees with *this repo's copy* of the contracts. When the copy is stale in the
      # same direction as the manifest the two agree perfectly and this job is green, while the
      # deploy — which regenerates the ABIs from the real artifacts — fails. That is the gap the
      # abi-drift job below closes.
      - name: Codegen + build
        run: npm run build

  # `graph build` only proves the mappings compile against the schema. It says nothing about what
  # a handler does when it runs, and this is the repo where doing the wrong thing produces silence
  # rather than an error — a handler that indexes nothing looks exactly like a chain with no
  # activity. The fail-closed branches are the sharpest case: they are the ones that decide to skip
  # rather than guess, they run only on inputs a normal deploy never sees, and until this job
  # existed they had never executed anywhere, so "fails closed" and "is broken" were the same
  # observation.
  test:
    name: mapping handler tests
    # Pinned to 22.04 rather than ubuntu-latest, because the matchstick release consumed below is
    # `binary-linux-22` — built for this image. Letting `latest` roll forward would silently pair
    # the binary with a distro it was not built against.
    runs-on: ubuntu-22.04
    # Kept off any scheduled run, and not for the reason that excludes `codegen + build`. This job's
    # answer genuinely *can* change without a commit: it re-downloads the pinned matchstick release
    # asset and verifies its SHA-256 every run, and a release asset is mutable, so nightly it would
    # double as an upstream-tamper check. That is worth having and it is still the wrong trade here.
    # On a cron the dominant failure is not tampering but availability — a 404 or a rate-limit — and
    # a nightly job that is periodically red for reasons unrelated to what it checks teaches people
    # to skip the whole run. The drift check shares this workflow, and it is the one thing on the
    # schedule that nobody would otherwise be looking at. Spending its credibility on download flake
    # is a bad exchange. If the tamper check is wanted, it should be its own job that says so.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      # Runs codegen first: generated/ is not committed, so without it the tests would compile
      # against nothing. scripts/matchstick.mjs downloads the pinned matchstick binary and
      # forwards its exit code, which is what makes a failing assertion fail the job.
      - name: Run mapping tests
        run: npm test

  # The ABIs in abis/ are a copy of a build output from another repo, and a copy can go stale
  # silently. prepare-local.mjs regenerates them from the Foundry artifacts at deploy time, so the
  # first thing that notices a stale copy is the deploy — which is exactly what happened with
  # LpPoolWhitelisted, where the manifest and the copy had both missed a second event parameter.
  #
  # So run the regeneration ahead of time and require it to be a no-op. The check runs the real
  # prepare-local.mjs rather than a purpose-built comparison, deliberately: a separate
  # implementation of "what the ABI should be" would be a second copy able to drift on its own,
  # which is the failure being fixed.
  abi-drift:
    name: committed ABIs match the deployed contracts
    # Self-hosted, because the authority lives on the box. A subgraph deploy does not pull the
    # contracts repo — it reads whatever clone is already there — so the artifacts on spartakus are
    # not an approximation of what the deploy will use, they are it. Compiling core's main on a
    # hosted runner would check a different and less relevant question.
    runs-on: [self-hosted, spartakus]
    # Being self-hosted, this job runs repository code on the deploy box, which holds the .env with
    # the deployer key and the seed mnemonic — a PR that could reach it would not need to exfiltrate
    # a workflow secret, the material is already on disk. Forking is disabled on this repo today, so
    # the branch below is unreachable; it is written down anyway because that is a setting rather
    # than a property, and the cost of turning it on should not be an unnoticed hole here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # Stated rather than left to fail as a confusing mount error: a box that has never deployed
      # has no clone to compare against, and that is a different problem from a drifted ABI.
      - name: Locate the contracts on the box
        run: |
          core="$HOME/koreth/repos/koreth-v1-core"
          test -d "$core/out" || { echo "No Foundry artifacts at $core/out — has this box ever run a deploy?"; exit 1; }
          # prepare-local.mjs reads this too, for networks.json. Left to fail on its own it raises a
          # Node ENOENT from inside the container, which reads like a broken script rather than a
          # box that has never deployed — and telling those two apart is the whole point of this step.
          test -f "$core/deployments/local.json" || { echo "No deployment at $core/deployments/local.json — has this box ever run a deploy?"; exit 1; }
          echo "CORE_DIR=$core" >> "$GITHUB_ENV"

      # Same node image and mount shape the deploy uses. The contracts are mounted read-only: this
      # job has no business writing into the clone a running stack was deployed from.
      - name: Regenerate the ABIs from the artifacts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CORE_ROOT=/core \
            -v "$CORE_DIR:/core:ro" \
            -v "$PWD:/sg" -w /sg \
            node:22-slim node scripts/prepare-local.mjs

      # Scoped to abis/. prepare-local.mjs also rewrites networks.json, whose addresses and
      # startBlock change with every fresh fork — it is per-deployment state, and comparing it here
      # would fail on every run for a reason that has nothing to do with drift.
      #
      # Staged first, because a plain `git diff` compares tracked files only. Adding a contract to
      # prepare-local.mjs generates an ABI that nothing has committed yet, and an untracked file is
      # invisible to `git diff` — the check would pass while claiming the committed ABIs are
      # complete, which is the kind of green this job exists to stop being possible.
      - name: Fail if the committed ABIs differ
        run: |
          git add -A -- abis/
          git diff --cached --exit-code -- abis/
